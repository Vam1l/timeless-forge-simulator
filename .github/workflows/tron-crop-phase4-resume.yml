name: Tron Crop Rotation Phase 4 Resume

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  RECOVERED_AI_SHA: "237300550e94586479bba9b1c6123af3e87cb179"
  VALIDATED_BASE_SHA: "29ac1c40fee5a7058f040398654198ae270f5b22"
  BEHAVIOR_BASE_SHA: "dc9f9c38c3626f5b2d112152c3d36c5139dd1ee1"
  VERIFIED_GATE1_RUN_ID: "33373034100"
  VERIFIED_GATE1_ARTIFACT_ID: "9750856252"
  VERIFIED_GATE1_ARTIFACT_SHA256: "1373c175355d5f02e5d873738a045c5f9b2be5d25cfabd629064020533645ea0"
  VERIFIED_GATE2_RUN_ID: "33397740795"
  VERIFIED_GATE2_ARTIFACT_ID: "9760035356"
  VERIFIED_GATE2_ARTIFACT_SHA256: "0dbc83bcc3f3c3e8a484080499f2aac5b558118c11540f644caa20c00cf82121"

jobs:
  gate3:
    name: Gate 3 exact bounded validation (16 games; reused Gates 1-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify behavior-source, deck, and recovered-blob identity
        run: |
          git diff --exit-code "$BEHAVIOR_BASE_SHA"...HEAD -- \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
            experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
            experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh \
            experimental/forge-ai/forge-patches battlebox/decks
          python scripts/validate_battlebox.py
          python experimental/forge-ai/verify_recovered_blobs.py | tee recovered-blob-verification-gate3.txt
          grep -q 'instanceof Number' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q '((Number) key).intValue()' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q 'ArrayListMultimap<Integer, SpellAbility>' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java

      - name: Reuse and verify passed Gate 1 and Gate 2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_GATE1_ARTIFACT_ID}/zip" \
            --output gate1.zip
          echo "${VERIFIED_GATE1_ARTIFACT_SHA256}  gate1.zip" | sha256sum -c - | tee gate1-artifact-sha256.txt
          mkdir -p gate1-evidence
          unzip -q gate1.zip -d gate1-evidence
          LOG=gate1-evidence/logs/candidate-tron-white-seed-95001.log
          test -f "$LOG"
          grep -q '^candidate,tron-white,10-tron.dck,01-white-weenie.dck,95001,' gate1-evidence/per-game.csv
          grep -q '\[TRON_CROP_REALPATH\].*legalCandidates=\[Urza.s Mine#35, Forest#44\].*uniqueTron=\[Urza.s Mine\].*candidateEnabled=true' "$LOG"
          grep -q '\[TRON_CROP_DECISION\].*activated=true.*selected=Forest#44' "$LOG"
          grep -q 'Zone Change: Forest (44) was put into Graveyard from Battlefield\.' "$LOG"
          grep -q '\[TRON_CROP_FETCH\].*controlledLands=\[Urza.s Mine#35\].*selected=Urza.s Tower#13 classification=missing_distinct_piece' "$LOG"
          ! grep -q '\[TRON_CROP_DECISION\].*selected=Urza.s Mine#35' "$LOG"

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_GATE2_ARTIFACT_ID}/zip" \
            --output gate2.zip
          echo "${VERIFIED_GATE2_ARTIFACT_SHA256}  gate2.zip" | sha256sum -c - | tee gate2-artifact-sha256.txt
          mkdir -p gate2-evidence
          unzip -q gate2.zip -d gate2-evidence
          test -f gate2-evidence/gate2-report.md
          test -f gate2-evidence/forge-recovered-diagnostic.jar
          test -f gate2-evidence/forge-tron-candidate.jar
          test -d gate2-evidence/res

      - name: Restore Forge runtime layout from passed Gate 2 artifact
        run: |
          cd "$GITHUB_WORKSPACE"
          cp gate2-evidence/forge-recovered-diagnostic.jar forge-recovered-diagnostic.jar
          cp gate2-evidence/forge-tron-candidate.jar forge-tron-candidate.jar
          rm -rf res
          cp -a gate2-evidence/res ./res
          test -d res
          test -f forge-recovered-diagnostic.jar
          test -f forge-tron-candidate.jar
          sha256sum forge-recovered-diagnostic.jar forge-tron-candidate.jar | tee gate3-runtime-build-sha256.txt
          printf 'runtime_workdir=%s\nresource_dir=%s\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/res" > runtime-layout.txt

      - name: Install and byte-verify unchanged decks
        run: |
          python experimental/forge-ai/prepare_forge_decks.py \
            --source battlebox/decks --destination "$HOME/.forge/decks/constructed"

      - name: Run exactly the authorized 16 Gate-3 games
        run: |
          cd "$GITHUB_WORKSPACE"
          python experimental/forge-ai/tron-crop-candidate/run_phase4.py --mode gate3 \
            --recovered forge-recovered-diagnostic.jar \
            --candidate forge-tron-candidate.jar \
            --source-decks battlebox/decks \
            --deck-dir "$HOME/.forge/decks/constructed" \
            --output tron-crop-phase4-final-results \
            --branch-sha "$GITHUB_SHA"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('tron-crop-phase4-final-results')
          rows=list(csv.DictReader((root/'per-game.csv').open()))
          assert len(rows)==16, len(rows)
          failures=json.loads((root/'runtime-failures.json').read_text())
          assert failures==[], failures
          PY

      - name: Assemble final Phase 4 artifact
        if: always()
        run: |
          ROOT=tron-crop-phase4-final-results
          mkdir -p "$ROOT/gate1" "$ROOT/gate2" "$ROOT/provenance"
          cp -r gate1-evidence/* "$ROOT/gate1/" 2>/dev/null || true
          cp gate2-evidence/gate2-report.md gate2-evidence/gate2-python-tests.txt gate2-evidence/tron-selector-java-tests.txt "$ROOT/gate2/" 2>/dev/null || true
          cp gate1-artifact-sha256.txt gate2-artifact-sha256.txt recovered-blob-verification-gate3.txt gate3-runtime-build-sha256.txt runtime-layout.txt "$ROOT/provenance/" 2>/dev/null || true
          cp gate2-evidence/behavior-source-identity.txt gate2-evidence/forge-build-sha256.txt gate2-evidence/candidate-computerutil-byte-identity.txt "$ROOT/provenance/" 2>/dev/null || true
          cat > "$ROOT/reproduction.md" <<EOF
          # Phase-4 final Gate-3 reproduction

          Gate 1 was not rerun. Reused run $VERIFIED_GATE1_RUN_ID artifact $VERIFIED_GATE1_ARTIFACT_ID after exact SHA-256 verification.
          Gate 2 was not rerun. Reused run $VERIFIED_GATE2_RUN_ID artifact $VERIFIED_GATE2_ARTIFACT_ID after exact SHA-256 verification.
          Forge runtime resources were restored from the Gate-2 artifact to $GITHUB_WORKSPACE/res before invocation.
          Gate 3 uses fixed seeds 95001-95006, 95301, 95302; recovered and candidate once per condition; exactly 16 games maximum; 120-second Forge clock.
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tron-crop-phase4-final-results
          path: tron-crop-phase4-final-results/
          retention-days: 90
