name: Tron Crop Rotation Phase 4 Resume

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  RECOVERED_AI_SHA: "237300550e94586479bba9b1c6123af3e87cb179"
  VALIDATED_BASE_SHA: "29ac1c40fee5a7058f040398654198ae270f5b22"
  BEHAVIOR_BASE_SHA: "dc9f9c38c3626f5b2d112152c3d36c5139dd1ee1"
  VERIFIED_GATE1_RUN_ID: "33373034100"
  VERIFIED_GATE1_ARTIFACT_ID: "9750856252"
  VERIFIED_GATE1_ARTIFACT_SHA256: "1373c175355d5f02e5d873738a045c5f9b2be5d25cfabd629064020533645ea0"

jobs:
  gate2:
    name: Gate 2 remaining verification (0 games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}

      - name: Verify behavior-source, deck, and recovered-blob identity
        run: |
          git diff --exit-code "$BEHAVIOR_BASE_SHA"...HEAD -- \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
            experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
            experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh
          git diff --exit-code "$BEHAVIOR_BASE_SHA"...HEAD -- \
            experimental/forge-ai/forge-patches battlebox/decks
          python scripts/validate_battlebox.py
          python experimental/forge-ai/verify_recovered_blobs.py | tee recovered-blob-verification.txt
          grep -q 'instanceof Number' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q '((Number) key).intValue()' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q 'ArrayListMultimap<Integer, SpellAbility>' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          {
            echo "behavior_base=$BEHAVIOR_BASE_SHA"
            for p in \
              experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
              experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
              experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh; do
              printf '%s current=' "$p"; sha256sum "$p" | cut -d' ' -f1
              printf '%s base=' "$p"; git show "$BEHAVIOR_BASE_SHA:$p" | sha256sum | cut -d' ' -f1
            done
          } | tee behavior-source-identity.txt

      - name: Download and substantively verify preserved Gate 1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_GATE1_ARTIFACT_ID}/zip" \
            --output gate1.zip
          echo "${VERIFIED_GATE1_ARTIFACT_SHA256}  gate1.zip" | sha256sum -c - | tee gate1-artifact-sha256.txt
          mkdir -p gate1-evidence
          unzip -q gate1.zip -d gate1-evidence
          LOG=gate1-evidence/logs/candidate-tron-white-seed-95001.log
          test -f "$LOG"
          grep -q '^candidate,tron-white,10-tron.dck,01-white-weenie.dck,95001,' gate1-evidence/per-game.csv
          grep -q '\[TRON_CROP_REALPATH\].*legalCandidates=\[Urza.s Mine#35, Forest#44\].*uniqueTron=\[Urza.s Mine\].*candidateEnabled=true' "$LOG"
          grep -q '\[TRON_CROP_REALPATH\].*missingAvailable=.*Urza.s Tower.*Urza.s Power Plant' "$LOG"
          grep -q '\[TRON_CROP_DECISION\].*activated=true.*selected=Forest#44' "$LOG"
          grep -q 'Zone Change: Forest (44) was put into Graveyard from Battlefield\.' "$LOG"
          grep -q '\[TRON_CROP_FETCH\].*controlledLands=\[Urza.s Mine#35\].*selected=Urza.s Tower#13 classification=missing_distinct_piece' "$LOG"
          ! grep -q '\[TRON_CROP_DECISION\].*selected=Urza.s Mine#35' "$LOG"
          ! grep -q '\[TRON_CROP_FETCH\].*selected=Urza.s Mine#35.*classification=missing_distinct_piece' "$LOG"
          printf 'source_run=%s\nartifact_id=%s\ndigest=sha256:%s\n' \
            "$VERIFIED_GATE1_RUN_ID" "$VERIFIED_GATE1_ARTIFACT_ID" "$VERIFIED_GATE1_ARTIFACT_SHA256" \
            > gate1-evidence/reused-gate1-provenance.txt

      - name: Run selector, parser, integration, fallback, and dead-hook tests
        run: |
          python -m unittest discover -s tests -v |& tee gate2-python-tests.txt
          mkdir -p candidate-java-tests
          javac -d candidate-java-tests \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelectionTest.java
          java -cp candidate-java-tests forge.ai.TronCropRotationSelectionTest | tee tron-selector-java-tests.txt
          grep -q 'chooseSacrificeType' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q '"Crop Rotation".equals(ability.getHostCard().getName())' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q 'ability.getApi() != ApiType.ChangeZone' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q 'type != null && type.contains("Land")' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py

      - name: Build exact recovered behavior and unchanged candidate behavior
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" forge-stock.jar
          cp forge-stock.jar forge-recovered-exact.jar
          RECOVERED_JAR="$PWD/forge-recovered-exact.jar"; cd experimental/forge-ai; ./apply_forge_patches.sh "$RECOVERED_JAR"
          cd "$GITHUB_WORKSPACE"
          mkdir -p resume-build/pre/forge/ai
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Card-Forge/forge/forge-2.0.14/forge-ai/src/main/java/forge/ai/ComputerUtil.java' \
            --output resume-build/ComputerUtil.java
          bash experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh \
            forge-recovered-exact.jar resume-build/ComputerUtil.java \
            experimental/forge-ai/forge-patches/forge/ai/ability/ChangeZoneAi.java \
            forge-recovered-diagnostic.jar forge-tron-candidate.jar resume-build/overlay
          git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py" > /tmp/base_candidate_overlay.py
          python /tmp/base_candidate_overlay.py \
            --input resume-build/ComputerUtil.java \
            --output resume-build/pre/forge/ai/ComputerUtil.java --mode candidate
          cmp resume-build/pre/forge/ai/ComputerUtil.java resume-build/overlay/candidate/src/forge/ai/ComputerUtil.java
          ! grep -q 'private static Card chooseTronCropRotationAssemblySacrifice' resume-build/overlay/candidate/src/forge/ai/ComputerUtil.java
          sha256sum forge-stock.jar forge-recovered-exact.jar forge-recovered-diagnostic.jar forge-tron-candidate.jar \
            | tee forge-build-sha256.txt
          sha256sum resume-build/pre/forge/ai/ComputerUtil.java resume-build/overlay/candidate/src/forge/ai/ComputerUtil.java \
            | tee candidate-computerutil-byte-identity.txt

      - name: Write Gate 2 report
        run: |
          cat > gate2-report.md <<EOF
          # Gate 2 remaining Phase-4 verification

          No gameplay was executed in Gate 2.

          - Behavioral baseline: $BEHAVIOR_BASE_SHA
          - Historical recovered AI: $RECOVERED_AI_SHA
          - Validated recovered base: $VALIDATED_BASE_SHA
          - Preserved Gate-1 run: $VERIFIED_GATE1_RUN_ID
          - Preserved Gate-1 artifact: $VERIFIED_GATE1_ARTIFACT_ID
          - Gate-1 SHA-256: $VERIFIED_GATE1_ARTIFACT_SHA256
          - Preserved Gate-1 path label is accepted as recorded; selected card and classification are the substantive fetch evidence.
          - Dead-hook exclusion checks method definition, not harmless defensive references.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: tron-crop-phase4-resume-gate2
          path: |
            forge-recovered-exact.jar
            forge-recovered-diagnostic.jar
            forge-tron-candidate.jar
            res/
            gate1-evidence/
            recovered-blob-verification.txt
            behavior-source-identity.txt
            gate1-artifact-sha256.txt
            gate2-python-tests.txt
            tron-selector-java-tests.txt
            forge-build-sha256.txt
            candidate-computerutil-byte-identity.txt
            gate2-report.md
            resume-build/overlay/*.diff
            resume-build/overlay/candidate/src/forge/ai/ComputerUtil.java
          retention-days: 90

  gate3:
    name: Gate 3 exact bounded validation (16 games)
    needs: gate2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: tron-crop-phase4-resume-gate2
          path: gate2-evidence
      - name: Install and byte-verify unchanged decks
        run: |
          python experimental/forge-ai/prepare_forge_decks.py \
            --source battlebox/decks --destination "$HOME/.forge/decks/constructed"
      - name: Reconfirm integrity before gameplay
        run: |
          git diff --exit-code "$BEHAVIOR_BASE_SHA"...HEAD -- \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
            experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
            experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh \
            experimental/forge-ai/forge-patches battlebox/decks
          python experimental/forge-ai/verify_recovered_blobs.py > recovered-blob-verification-gate3.txt
      - name: Run exactly the authorized 16 Gate-3 games
        run: |
          python experimental/forge-ai/tron-crop-candidate/run_phase4.py --mode gate3 \
            --recovered gate2-evidence/forge-recovered-diagnostic.jar \
            --candidate gate2-evidence/forge-tron-candidate.jar \
            --source-decks battlebox/decks \
            --deck-dir "$HOME/.forge/decks/constructed" \
            --output tron-crop-phase4-resume-results \
            --branch-sha "$GITHUB_SHA"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('tron-crop-phase4-resume-results')
          rows=list(csv.DictReader((root/'per-game.csv').open()))
          assert len(rows)==16, len(rows)
          failures=json.loads((root/'runtime-failures.json').read_text())
          assert failures==[], failures
          PY
      - name: Assemble final continuation artifact
        if: always()
        run: |
          mkdir -p tron-crop-phase4-resume-results/gate1 tron-crop-phase4-resume-results/gate2 tron-crop-phase4-resume-results/provenance
          cp -r gate2-evidence/gate1-evidence/* tron-crop-phase4-resume-results/gate1/ 2>/dev/null || true
          cp gate2-evidence/gate2-report.md gate2-evidence/gate2-python-tests.txt gate2-evidence/tron-selector-java-tests.txt tron-crop-phase4-resume-results/gate2/ 2>/dev/null || true
          cp gate2-evidence/recovered-blob-verification.txt gate2-evidence/behavior-source-identity.txt gate2-evidence/gate1-artifact-sha256.txt gate2-evidence/forge-build-sha256.txt gate2-evidence/candidate-computerutil-byte-identity.txt recovered-blob-verification-gate3.txt tron-crop-phase4-resume-results/provenance/ 2>/dev/null || true
          cat > tron-crop-phase4-resume-results/reproduction.md <<EOF
          # Phase-4 continuation reproduction

          Gate 1 was not rerun. Evidence was reused from run $VERIFIED_GATE1_RUN_ID artifact $VERIFIED_GATE1_ARTIFACT_ID after exact SHA-256 verification.

          Gate 3 used run_phase4.py --mode gate3 with exact recovered gameplay behavior plus telemetry-only diagnostic overlay and the unchanged candidate behavior. Fixed seeds: 95001-95006, 95301, 95302; one game per build/condition; 16 games total; 120-second Forge clock.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tron-crop-phase4-resume-results
          path: tron-crop-phase4-resume-results/
          retention-days: 90
