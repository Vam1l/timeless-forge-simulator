name: Hunting Storm Focused A/B

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  RECOVERED_AI_SHA: "237300550e94586479bba9b1c6123af3e87cb179"

jobs:
  static-audit:
    name: Repository/static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: test -f experimental/forge-ai/HUNTING_AB_ONLY
      - run: test ! -f experimental/forge-ai/HUNTING_DIAGNOSTIC_ONLY
      - run: git fetch origin main:refs/remotes/origin/main
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_battlebox.py
      - run: python -m compileall -q timeless_forge scripts experimental/forge-ai
      - name: Verify recovered Forge source blob integrity
        run: python experimental/forge-ai/verify_recovered_blobs.py
      - name: Check authored-file whitespace
        run: git diff --check origin/main...HEAD -- . ':(exclude)experimental/forge-ai/forge-patches/**'
      - name: Verify decks unchanged
        run: git diff --exit-code origin/main...HEAD -- battlebox/decks
      - run: python experimental/forge-ai/static_audit.py

  forge-build:
    name: Compile exact stock and recovered Forge 2.0.14 builds
    needs: static-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download stock Forge 2.0.14
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" forge-stock.jar
          cp forge-stock.jar forge-patched.jar
          test -s forge-stock.jar
      - name: Compile exact recovered PR2 classes
        run: |
          PATCHED_JAR="$PWD/forge-patched.jar"
          cd experimental/forge-ai
          ./apply_forge_patches.sh "$PATCHED_JAR"
      - name: Record identities
        run: |
          sha256sum forge-stock.jar forge-patched.jar > forge-build-sha256.txt
          git rev-parse HEAD > branch-sha.txt
          printf '%s\n' "$RECOVERED_AI_SHA" > recovered-ai-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hunting-focused-ab-builds
          path: |
            forge-stock.jar
            forge-patched.jar
            res/
            forge-build-sha256.txt
            branch-sha.txt
            recovered-ai-sha.txt
          retention-days: 7

  hunting-focused-ab:
    name: Hunting Storm matched-seed A/B (96 games)
    needs: forge-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: hunting-focused-ab-builds
      - name: Install and byte-verify unchanged battle-box decks
        run: |
          python experimental/forge-ai/prepare_forge_decks.py \
            --source battlebox/decks \
            --destination "$HOME/.forge/decks/constructed"
      - name: Run 96-game Hunting-only matched-seed comparison
        run: |
          python experimental/forge-ai/hunting-focused-ab.py \
            --stock forge-stock.jar \
            --patched forge-patched.jar \
            --deck-dir "$HOME/.forge/decks/constructed" \
            --output hunting-focused-ab-results \
            --branch-sha "$GITHUB_SHA" \
            --recovered-ai-sha "$RECOVERED_AI_SHA"
      - name: Add report summary
        if: always()
        run: |
          if [ -f hunting-focused-ab-results/report.md ]; then
            cat hunting-focused-ab-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunting-storm-focused-ab-results
          path: hunting-focused-ab-results/
          retention-days: 90
