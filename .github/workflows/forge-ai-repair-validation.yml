name: Remaining Nine Forge AI Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  RECOVERED_AI_SHA: "237300550e94586479bba9b1c6123af3e87cb179"
  VALIDATED_BASE_SHA: "29ac1c40fee5a7058f040398654198ae270f5b22"
  PRODUCTION_MAIN_SHA: "ee667eb8b110cd985578eef2acc3e9c97db861c8"

jobs:
  static-validation:
    name: Repository/static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Verify isolated validation mode
        run: |
          test -f experimental/forge-ai/REMAINING_NINE_AI_ONLY
          test ! -f experimental/forge-ai/HUNTING_DIAGNOSTIC_ONLY
          test ! -f experimental/forge-ai/HUNTING_AB_ONLY
      - name: Fetch production main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate all ten unchanged 60-card decks
        run: python scripts/validate_battlebox.py
      - name: Python compilation
        run: python -m compileall -q timeless_forge scripts experimental/forge-ai
      - name: Verify exact recovered Forge blob integrity
        run: python experimental/forge-ai/verify_recovered_blobs.py
      - name: Verify authored-file whitespace
        run: git diff --check origin/main...HEAD -- . ':(exclude)experimental/forge-ai/forge-patches/**'
      - name: Verify deck directory byte-identical to production main
        run: git diff --exit-code origin/main...HEAD -- battlebox/decks
      - name: Verify branch contains no gameplay-source changes
        run: |
          test -z "$(git diff --name-only "$VALIDATED_BASE_SHA"...HEAD -- battlebox/decks experimental/forge-ai/forge-patches)"
      - name: Existing recovered-source static audit
        run: python experimental/forge-ai/static_audit.py

  forge-build:
    name: Build stock and exact recovered Forge 2.0.14
    needs: static-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Download stock Forge 2.0.14
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" forge-stock.jar
          cp forge-stock.jar forge-patched.jar
          test -s forge-stock.jar
      - name: Compile exact recovered historical PR2 classes
        run: |
          PATCHED_JAR="$PWD/forge-patched.jar"
          cd experimental/forge-ai
          ./apply_forge_patches.sh "$PATCHED_JAR"
      - name: Record exact build identities
        run: |
          sha256sum forge-stock.jar forge-patched.jar > forge-build-sha256.txt
          git rev-parse HEAD > workflow-checkout-sha.txt
          printf '%s\n' "$VALIDATED_BASE_SHA" > validated-base-sha.txt
          printf '%s\n' "$RECOVERED_AI_SHA" > recovered-ai-sha.txt
          printf '%s\n' "$PRODUCTION_MAIN_SHA" > production-main-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-nine-forge-builds
          path: |
            forge-stock.jar
            forge-patched.jar
            res/
            forge-build-sha256.txt
            workflow-checkout-sha.txt
            validated-base-sha.txt
            recovered-ai-sha.txt
            production-main-sha.txt
          retention-days: 7

  remaining-nine-validation:
    name: Remaining nine bounded behavioral validation (52 games)
    needs: forge-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: remaining-nine-forge-builds
      - name: Install and byte-verify unchanged decks in Forge constructed directory
        run: |
          python experimental/forge-ai/prepare_forge_decks.py \
            --source battlebox/decks \
            --destination "$HOME/.forge/decks/constructed"
      - name: Run hard preflight plus exactly 52 bounded behavioral games
        run: |
          python experimental/forge-ai/remaining-nine/run_validation_entry.py \
            --stock forge-stock.jar \
            --patched forge-patched.jar \
            --source-decks battlebox/decks \
            --deck-dir "$HOME/.forge/decks/constructed" \
            --output remaining-nine-results \
            --branch-sha "$GITHUB_SHA"
      - name: Copy provenance and pre-outcome checklists into artifact
        if: always()
        run: |
          mkdir -p remaining-nine-results
          cp experimental/forge-ai/remaining-nine/STRATEGY_CHECKLISTS.md remaining-nine-results/strategy-checklists.md
          cp forge-build-sha256.txt remaining-nine-results/forge-build-sha256.txt
          cp validated-base-sha.txt remaining-nine-results/validated-base-sha.txt
          cp recovered-ai-sha.txt remaining-nine-results/recovered-ai-sha.txt
          cp production-main-sha.txt remaining-nine-results/production-main-sha.txt
          git rev-parse HEAD > remaining-nine-results/branch-sha.txt
          git diff --name-status "$VALIDATED_BASE_SHA"...HEAD > remaining-nine-results/branch-diff-files.txt
      - name: Add final gate summary
        if: always()
        run: |
          if [ -f remaining-nine-results/final-gate-report.md ]; then
            cat remaining-nine-results/final-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-nine-ai-validation
          path: remaining-nine-results/
          retention-days: 90
