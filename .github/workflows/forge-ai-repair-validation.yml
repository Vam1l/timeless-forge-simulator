name: Tron Crop Rotation Candidate Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  RECOVERED_AI_SHA: "237300550e94586479bba9b1c6123af3e87cb179"
  VALIDATED_BASE_SHA: "29ac1c40fee5a7058f040398654198ae270f5b22"
  PR7_BASE_SHA: "c857f2d5667143140b94d4105a6ef065dd256728"
  BEHAVIOR_BASE_SHA: "dc9f9c38c3626f5b2d112152c3d36c5139dd1ee1"
  VERIFIED_GATE1_RUN_ID: "33373034100"
  VERIFIED_GATE1_ARTIFACT_ID: "9750856252"
  VERIFIED_GATE1_ARTIFACT_SHA256: "1373c175355d5f02e5d873738a045c5f9b2be5d25cfabd629064020533645ea0"

jobs:
  provenance:
    name: Provenance and telemetry-only source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify isolated Phase 4 mode
        run: |
          test -f experimental/forge-ai/TRON_CROP_CANDIDATE_ONLY
          test ! -f experimental/forge-ai/REMAINING_NINE_AI_ONLY
          test ! -f experimental/forge-ai/HUNTING_DIAGNOSTIC_ONLY
          test ! -f experimental/forge-ai/HUNTING_AB_ONLY
      - name: Fetch production main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Validate unchanged repository inputs
        run: |
          python scripts/validate_battlebox.py
          python -m compileall -q timeless_forge scripts experimental/forge-ai
          python experimental/forge-ai/verify_recovered_blobs.py | tee recovered-blob-verification.txt
          git diff --check origin/main...HEAD -- . ':(exclude)experimental/forge-ai/forge-patches/**'
          git diff --exit-code origin/main...HEAD -- battlebox/decks
          test -z "$(git diff --name-only "$PR7_BASE_SHA"...HEAD -- experimental/forge-ai/forge-patches battlebox/decks)"
          grep -q 'instanceof Number' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q '((Number) key).intValue()' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q 'ArrayListMultimap<Integer, SpellAbility>' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
      - name: Prove behavioral candidate sources unchanged from run 13
        run: |
          git diff --exit-code "$BEHAVIOR_BASE_SHA"...HEAD -- \
            experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
            experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
            experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh
          {
            echo "Behavior base: $BEHAVIOR_BASE_SHA"
            for p in \
              experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java \
              experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py \
              experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh; do
              printf '%s current=' "$p"; sha256sum "$p" | cut -d' ' -f1
              printf '%s base=' "$p"; git show "$BEHAVIOR_BASE_SHA:$p" | sha256sum | cut -d' ' -f1
            done
          } | tee behavior-source-commit-comparison.txt
      - name: Repository and telemetry parser tests
        run: python -m unittest discover -s tests -v |& tee telemetry-regression-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tron-crop-v3-provenance
          path: |
            recovered-blob-verification.txt
            behavior-source-commit-comparison.txt
            telemetry-regression-tests.txt
          retention-days: 90

  builds:
    name: Build unchanged recovered behavior plus logging-only telemetry
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Download stock Forge and build exact recovered
        run: |
          curl --fail --location --retry 3 "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" forge-stock.jar
          cp forge-stock.jar forge-recovered-exact.jar
          RECOVERED_JAR="$PWD/forge-recovered-exact.jar"; cd experimental/forge-ai; ./apply_forge_patches.sh "$RECOVERED_JAR"
      - name: Fetch exact Forge ComputerUtil and build telemetry overlays
        run: |
          mkdir -p tron-v3-build
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Card-Forge/forge/forge-2.0.14/forge-ai/src/main/java/forge/ai/ComputerUtil.java' --output tron-v3-build/ComputerUtil.java
          bash experimental/forge-ai/tron-crop-candidate/build_candidate_jar.sh \
            forge-recovered-exact.jar tron-v3-build/ComputerUtil.java \
            experimental/forge-ai/forge-patches/forge/ai/ability/ChangeZoneAi.java \
            forge-recovered-diagnostic.jar forge-tron-candidate.jar tron-v3-build/overlay
      - name: Calculate before/after behavioral-source identity and logging-only diff
        run: |
          mkdir -p tron-v3-build/pre-telemetry/forge/ai/ability tron-v3-build/pre-telemetry/forge/ai
          git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py" > /tmp/pre_candidate_overlay.py
          git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/apply_fetch_telemetry.py" > /tmp/pre_fetch_telemetry.py
          git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java" > tron-v3-build/pre-telemetry/forge/ai/TronCropRotationSelection.java
          python /tmp/pre_candidate_overlay.py --input tron-v3-build/ComputerUtil.java \
            --output tron-v3-build/pre-telemetry/forge/ai/ComputerUtil.java --mode candidate
          python /tmp/pre_fetch_telemetry.py \
            --input experimental/forge-ai/forge-patches/forge/ai/ability/ChangeZoneAi.java \
            --output tron-v3-build/pre-telemetry/forge/ai/ability/ChangeZoneAi.java
          cmp tron-v3-build/pre-telemetry/forge/ai/ComputerUtil.java tron-v3-build/overlay/candidate/src/forge/ai/ComputerUtil.java
          cmp tron-v3-build/pre-telemetry/forge/ai/TronCropRotationSelection.java tron-v3-build/overlay/candidate/src/forge/ai/TronCropRotationSelection.java
          sha256sum \
            tron-v3-build/pre-telemetry/forge/ai/ComputerUtil.java \
            tron-v3-build/overlay/candidate/src/forge/ai/ComputerUtil.java \
            tron-v3-build/pre-telemetry/forge/ai/TronCropRotationSelection.java \
            tron-v3-build/overlay/candidate/src/forge/ai/TronCropRotationSelection.java \
            tron-v3-build/pre-telemetry/forge/ai/ability/ChangeZoneAi.java \
            tron-v3-build/overlay/candidate/src/forge/ai/ability/ChangeZoneAi.java \
            > behavior-source-byte-comparison.txt
          diff -u tron-v3-build/pre-telemetry/forge/ai/ability/ChangeZoneAi.java \
            tron-v3-build/overlay/candidate/src/forge/ai/ability/ChangeZoneAi.java \
            > logging-only-changezone.diff || true
          grep -q 'TRON_CROP_FETCH' logging-only-changezone.diff
          ! grep -E '^[+-].*(TronCropRotationSelection|allowedSacrificeNames|return c;|c = ComputerUtilCard|getBestLandAI|basicManaFixing)' logging-only-changezone.diff
      - name: Record build identities
        run: |
          sha256sum forge-stock.jar forge-recovered-exact.jar forge-recovered-diagnostic.jar forge-tron-candidate.jar > forge-four-build-sha256.txt
          git rev-parse HEAD > candidate-branch-sha.txt
          git diff --name-status "$BEHAVIOR_BASE_SHA"...HEAD > telemetry-iteration-diff-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tron-crop-v3-builds
          path: |
            forge-stock.jar
            forge-recovered-exact.jar
            forge-recovered-diagnostic.jar
            forge-tron-candidate.jar
            res/
            forge-four-build-sha256.txt
            candidate-branch-sha.txt
            telemetry-iteration-diff-files.txt
            behavior-source-byte-comparison.txt
            logging-only-changezone.diff
            tron-v3-build/overlay/*.diff
            tron-v3-build/overlay/build-sha256.txt
            tron-v3-build/overlay/candidate/src/forge/ai/ComputerUtil.java
            tron-v3-build/overlay/candidate/src/forge/ai/TronCropRotationSelection.java
            tron-v3-build/overlay/candidate/src/forge/ai/ability/ChangeZoneAi.java
          retention-days: 7

  gate1:
    name: Reuse passed Gate 1 evidence from run 33373034100 (0 games)
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify previously passed Gate-1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIED_GATE1_ARTIFACT_ID}/zip" \
            --output gate1.zip
          echo "${VERIFIED_GATE1_ARTIFACT_SHA256}  gate1.zip" | sha256sum -c -
          mkdir -p gate1-results
          unzip -q gate1.zip -d gate1-results
          test -f gate1-results/logs/candidate-tron-white-seed-95001.log
          grep -q '\[TRON_CROP_REALPATH\]' gate1-results/logs/candidate-tron-white-seed-95001.log
          grep -q '\[TRON_CROP_DECISION\].*activated=true' gate1-results/logs/candidate-tron-white-seed-95001.log
          grep -q '\[TRON_CROP_FETCH\].*path=battlefield_best_ai.*classification=missing_distinct_piece' gate1-results/logs/candidate-tron-white-seed-95001.log
          printf 'source_run=%s\nartifact_id=%s\ndigest=sha256:%s\n' \
            "$VERIFIED_GATE1_RUN_ID" "$VERIFIED_GATE1_ARTIFACT_ID" "$VERIFIED_GATE1_ARTIFACT_SHA256" \
            > gate1-results/reused-gate1-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tron-crop-v3-gate1
          path: gate1-results/
          retention-days: 90

  gate2:
    name: Verification Gate 2 selector, real-entry, fetch telemetry regressions
    needs: [builds, gate1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-gate1, path: gate1-evidence}
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-builds, path: build-evidence}
      - name: Selector and telemetry regression tests
        run: |
          python -m unittest discover -s tests -v |& tee gate2-python-tests.txt
          mkdir -p candidate-java-tests
          javac -d candidate-java-tests experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java experimental/forge-ai/tron-crop-candidate/TronCropRotationSelectionTest.java
          java -cp candidate-java-tests forge.ai.TronCropRotationSelectionTest | tee tron-selector-java-tests.txt
      - name: Prove real chooseSacrificeType integration and unrelated fallback guard
        run: |
          LOG=gate1-evidence/logs/candidate-tron-white-seed-95001.log
          grep -q '\[TRON_CROP_REALPATH\]' "$LOG"
          grep -q '\[TRON_CROP_DECISION\].*activated=true' "$LOG"
          grep -q '\[TRON_CROP_FETCH\].*path=battlefield_best_ai.*classification=missing_distinct_piece' "$LOG"
          grep -q 'chooseSacrificeType' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q '"Crop Rotation".equals(ability.getHostCard().getName())' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q 'ability.getApi() != ApiType.ChangeZone' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          grep -q 'type != null && type.contains("Land")' experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
          ! grep -q 'private static Card chooseTronCropRotationAssemblySacrifice' build-evidence/tron-v3-build/overlay/candidate/src/forge/ai/ComputerUtil.java
          grep -q 'path=battlefield_best_ai' "$LOG"
          grep -q 'general_land_best' experimental/forge-ai/tron-crop-candidate/apply_fetch_telemetry.py
          grep -q 'battlefield_keycard' experimental/forge-ai/tron-crop-candidate/apply_fetch_telemetry.py
          cmp <(git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java") experimental/forge-ai/tron-crop-candidate/TronCropRotationSelection.java
          cmp <(git show "$BEHAVIOR_BASE_SHA:experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py") experimental/forge-ai/tron-crop-candidate/apply_candidate_overlay.py
      - name: Reconfirm Byte Integer normalization
        run: |
          grep -q 'instanceof Number' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
          grep -q '((Number) key).intValue()' experimental/forge-ai/forge-patches/forge/ai/ComputerUtilMana.java
      - uses: actions/upload-artifact@v4
        with:
          name: tron-crop-v3-gate2
          path: |
            gate2-python-tests.txt
            tron-selector-java-tests.txt
          retention-days: 90

  gate3:
    name: Verification Gate 3 bounded matched validation (16 games)
    needs: [builds, gate1, gate2, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-builds}
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-gate1, path: gate1-evidence}
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-gate2, path: gate2-evidence}
      - uses: actions/download-artifact@v4
        with: {name: tron-crop-v3-provenance, path: provenance-evidence}
      - name: Install and byte-verify unchanged decks
        run: python experimental/forge-ai/prepare_forge_decks.py --source battlebox/decks --destination "$HOME/.forge/decks/constructed"
      - name: Run exactly 16 matched Gate-3 games
        run: |
          python experimental/forge-ai/tron-crop-candidate/run_phase4.py --mode gate3 \
            --recovered forge-recovered-diagnostic.jar --candidate forge-tron-candidate.jar \
            --source-decks battlebox/decks --deck-dir "$HOME/.forge/decks/constructed" \
            --output tron-crop-v3-results --branch-sha "$GITHUB_SHA"
      - name: Assemble complete verification artifact
        if: always()
        run: |
          mkdir -p tron-crop-v3-results/provenance tron-crop-v3-results/gate1 tron-crop-v3-results/gate2
          cp -r gate1-evidence/* tron-crop-v3-results/gate1/ 2>/dev/null || true
          cp -r gate2-evidence/* tron-crop-v3-results/gate2/ 2>/dev/null || true
          cp -r provenance-evidence/* tron-crop-v3-results/provenance/ 2>/dev/null || true
          cp forge-four-build-sha256.txt candidate-branch-sha.txt telemetry-iteration-diff-files.txt behavior-source-byte-comparison.txt logging-only-changezone.diff tron-crop-v3-results/provenance/
          cp tron-v3-build/overlay/*.diff tron-crop-v3-results/provenance/ 2>/dev/null || true
          git diff --exit-code origin/main...HEAD -- battlebox/decks > tron-crop-v3-results/provenance/deck-diff-main.txt
          python experimental/forge-ai/verify_recovered_blobs.py > tron-crop-v3-results/provenance/recovered-blob-verification-final.txt
          cat > tron-crop-v3-results/reproduction.md <<'EOF'
          # Reproduction
          Gate 1 evidence is reused from run 33373034100, artifact 9750856252, after SHA-256 verification; no Gate-1 game is rerun.
          Gate 3: run_phase4.py --mode gate3 with exact recovered diagnostic and candidate JARs using fixed seeds 95001-95006, 95301, 95302.
          Deck directory: $HOME/.forge/decks/constructed. Clock: 120 seconds. One game per condition.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tron-crop-rotation-phase4-v3
          path: tron-crop-v3-results/
          retention-days: 90
