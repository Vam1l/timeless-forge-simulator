name: White v0.4 and Blue v0.2 AI-Safe Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/six-deck-white-v04-blue-v02-20260903

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  DECK_DIR: experiments/six-deck-v0.1/decks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact White v0.4 and Blue v0.2 inputs
        run: |
          grep -Fx '4 Garrison Cat' "$DECK_DIR/01-mono-white-tokens.dck"
          grep -Fx "2 Captain's Call" "$DECK_DIR/01-mono-white-tokens.dck"
          grep -Fx '2 Fortify' "$DECK_DIR/01-mono-white-tokens.dck"
          ! grep -F 'Lunarch Veteran' "$DECK_DIR/01-mono-white-tokens.dck"
          ! grep -F 'Battle Screech' "$DECK_DIR/01-mono-white-tokens.dck"
          ! grep -F 'Intangible Virtue' "$DECK_DIR/01-mono-white-tokens.dck"
          test "$(awk '/^[0-9]+ / {sum += $1} END {print sum}' "$DECK_DIR/01-mono-white-tokens.dck")" = 60
          grep -Fx '4 Mental Note' "$DECK_DIR/05-mono-blue-tempo-control.dck"
          grep -Fx '3 Frost Trickster' "$DECK_DIR/05-mono-blue-tempo-control.dck"
          ! grep -F 'Thought Scour' "$DECK_DIR/05-mono-blue-tempo-control.dck"
          ! grep -F 'Echoing Truth' "$DECK_DIR/05-mono-blue-tempo-control.dck"
          test "$(awk '/^[0-9]+ / {sum += $1} END {print sum}' "$DECK_DIR/05-mono-blue-tempo-control.dck")" = 60

  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
          sha256sum "forge-${FORGE_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: v04-ai-safe-forge-${{ env.FORGE_VERSION }}
          path: |
            forge-${{ env.FORGE_VERSION }}.jar
            res/
          retention-days: 1

  audit:
    needs: [validate, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: green
            opponent: 02-mono-green-ramp.dck
            seed: 98101
          - label: red
            opponent: 03-mono-red-burn.dck
            seed: 98201
          - label: black
            opponent: 04-mono-black-sacrifice.dck
            seed: 98301
          - label: blue
            opponent: 05-mono-blue-tempo-control.dck
            seed: 98401
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: v04-ai-safe-forge-${{ env.FORGE_VERSION }}
      - name: Run six verbose games
        env:
          LABEL: ${{ matrix.label }}
          OPPONENT: ${{ matrix.opponent }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p "verbose-${LABEL}"
          mkdir -p "$HOME/.forge/decks/constructed"
          cp "$DECK_DIR"/*.dck "$HOME/.forge/decks/constructed/"
          timeout 240s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d 01-mono-white-tokens.dck "$OPPONENT" -D "$DECK_DIR" \
            -n 3 -c 120 -s "$SEED" \
            > "verbose-${LABEL}/white-first.log" 2>&1
          reverse_seed=$((SEED + 1))
          timeout 240s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d "$OPPONENT" 01-mono-white-tokens.dck -D "$DECK_DIR" \
            -n 3 -c 120 -s "$reverse_seed" \
            > "verbose-${LABEL}/white-second.log" 2>&1
          test "$(grep -hF 'Game Result: Game' verbose-${LABEL}/*.log | wc -l)" = 6
          grep -hF 'Simulation mode' verbose-${LABEL}/*.log >/dev/null
          ! grep -Eiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|No deck found|Could not load deck|match cannot start|Forge exited' verbose-${LABEL}/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: white-v04-blue-v02-verbose-${{ matrix.label }}
          path: verbose-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: white-v04-blue-v02-verbose-*
          path: white-v04-blue-v02-verbose-audit
      - name: Enforce verbose completeness
        run: |
          test "$(find white-v04-blue-v02-verbose-audit -name '*.log' | wc -l)" = 8
          test "$(grep -rhF 'Game Result: Game' white-v04-blue-v02-verbose-audit | wc -l)" = 24
          grep -rhF 'cast Mental Note' white-v04-blue-v02-verbose-audit/white-v04-blue-v02-verbose-blue/ >/dev/null
          grep -rhF 'cast Frost Trickster' white-v04-blue-v02-verbose-audit/white-v04-blue-v02-verbose-blue/ >/dev/null
          ! grep -rF 'cast Thought Scour' white-v04-blue-v02-verbose-audit
          ! grep -rF 'cast Echoing Truth' white-v04-blue-v02-verbose-audit
          ! grep -rEiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|No deck found|Could not load deck|match cannot start|Forge exited' white-v04-blue-v02-verbose-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: white-v04-blue-v02-verbose-audit
          path: white-v04-blue-v02-verbose-audit/
          if-no-files-found: error
          retention-days: 30
