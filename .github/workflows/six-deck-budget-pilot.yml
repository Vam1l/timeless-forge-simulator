name: Six-Deck Budget Battle Box Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/six-deck-budget-pilot-20260903

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate harness and six decks
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          for deck in sorted(Path('experiments/six-deck-v0.1/decks').glob('*.dck')):
              count = 0
              in_main = False
              for raw in deck.read_text().splitlines():
                  line = raw.strip()
                  if line == '[Main]':
                      in_main = True
                  elif in_main and line and not line.startswith('['):
                      count += int(line.split(' ', 1)[0])
              assert count == 60, f'{deck}: {count} cards'
          PY

  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
          sha256sum "forge-${FORGE_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: six-deck-forge-${{ env.FORGE_VERSION }}
          path: |
            forge-${{ env.FORGE_VERSION }}.jar
            res/
          retention-days: 1

  simulate:
    needs: [validate, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: six-deck-forge-${{ env.FORGE_VERSION }}
      - name: Run five orientations
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          start=$((BATCH * 5))
          indices=$(seq "$start" "$((start + 4))")
          python scripts/run_matchup_batch.py \
            --matchup-indices $indices \
            --config experiments/six-deck-v0.1/pilot-300.json \
            --forge-jar "forge-${FORGE_VERSION}.jar" \
            --output "six-deck-batch-${BATCH}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-deck-budget-pilot-batch-${{ matrix.batch }}
          path: six-deck-batch-${{ matrix.batch }}/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: six-deck-budget-pilot-batch-*
          path: all-results
      - run: python scripts/aggregate_results.py all-results six-deck-pilot-results
      - name: Enforce parse-completeness gate
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('six-deck-pilot-results/summary.csv').open()))
          requested = sum(int(row['requested_games']) for row in rows)
          parsed = sum(int(row['parsed_games']) for row in rows)
          unparsed = sum(int(row['unparsed']) for row in rows)
          assert len(rows) == 30, len(rows)
          assert requested == 300, requested
          assert parsed == 300, parsed
          assert unparsed == 0, unparsed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-deck-budget-pilot-results
          path: six-deck-pilot-results/
          if-no-files-found: error
          retention-days: 30
