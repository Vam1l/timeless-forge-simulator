name: Six-Deck Budget Battle Box Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/six-deck-budget-pilot-20260903

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Validate harness and six decks
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          for deck in sorted(Path('experiments/six-deck-v0.1/decks').glob('*.dck')):
              count = 0
              in_main = False
              for raw in deck.read_text().splitlines():
                  line = raw.strip()
                  if line == '[Main]':
                      in_main = True
                  elif in_main and line and not line.startswith('['):
                      count += int(line.split(' ', 1)[0])
              assert count == 60, f'{deck}: {count} cards'
          PY
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
          sha256sum "forge-${FORGE_VERSION}.jar"
      - name: Run 300-game orientation-balanced pilot
        run: |
          python scripts/run_matchup_batch.py \
            --matchup-indices $(seq 0 29) \
            --config experiments/six-deck-v0.1/pilot-300.json \
            --forge-jar "forge-${FORGE_VERSION}.jar" \
            --output six-deck-pilot-results
      - name: Enforce parse-completeness gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('six-deck-pilot-results/summary.json').read_text())
          results = summary['results']
          requested = sum(row['requested_games'] for row in results)
          parsed = sum(row['parsed_games'] for row in results)
          unparsed = sum(row['unparsed'] for row in results)
          assert len(results) == 30, len(results)
          assert requested == 300, requested
          assert parsed == 300, parsed
          assert unparsed == 0, unparsed
          PY
      - name: Add raw summary
        if: always()
        run: |
          if test -f six-deck-pilot-results/summary.md; then
            cat six-deck-pilot-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-deck-budget-pilot-results
          path: six-deck-pilot-results/
          if-no-files-found: error
          retention-days: 30
