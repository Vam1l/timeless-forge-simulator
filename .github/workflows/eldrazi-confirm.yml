name: Eldrazi Optimization Confirmation

on:
  push:
    branches:
      - analysis/eldrazi-confirm-20260930
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
      - name: Generate confirmation candidates
        run: python eldrazi-confirm/generate_confirm.py
      - name: Validate candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from timeless_forge.deck import load_deck, validate_deck
          failed = False
          for path in sorted(Path('eldrazi-confirm').glob('*.dck')):
              errors = validate_deck(load_deck(path))
              print(('FAIL ' if errors else 'OK   ') + str(path))
              for error in errors:
                  print('  ' + error)
              failed |= bool(errors)
          raise SystemExit(int(failed))
          PY
      - name: Run confirmation shard
        run: |
          indices=$(python - <<'PY'
          import json
          data = json.load(open('eldrazi-confirm/experiment.json'))
          shard = ${{ matrix.shard }}
          start = shard * 4
          stop = min(start + 4, len(data['matchups']))
          print(' '.join(map(str, range(start, stop))))
          PY
          )
          python scripts/run_matchup_batch.py \
            --matchup-indices $indices \
            --config eldrazi-confirm/experiment.json \
            --forge-jar "forge-${FORGE_VERSION}.jar" \
            --output eldrazi-confirm-results-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldrazi-confirm-results-${{ matrix.shard }}
          path: |
            eldrazi-confirm-results-${{ matrix.shard }}/
            eldrazi-confirm/*.dck
            eldrazi-confirm/experiment.json
          if-no-files-found: warn
          retention-days: 30
