name: Reality Fracture Eldrazi Gauntlet

on:
  push:
    branches:
      - analysis/eldrazi-reality-fracture-20260930
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        matchup: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
      - name: Validate deck files
        run: |
          python - <<'PY'
          from pathlib import Path
          from timeless_forge.deck import load_deck, validate_deck
          paths = [
            Path('eldrazi-rf/eldrazi-eye.dck'),
            Path('froganimator-splits/split-grief2.dck'),
            Path('mardu-opt/stock.dck'),
            Path('froganimator-splits/show-and-tell.dck'),
          ]
          failed = False
          for path in paths:
              errors = validate_deck(load_deck(path))
              print(('FAIL ' if errors else 'OK   ') + str(path))
              for error in errors:
                  print('  ' + error)
              failed |= bool(errors)
          raise SystemExit(int(failed))
          PY
      - name: Run paired-orientation matchup
        run: |
          python scripts/run_matchup_batch.py \
            --matchup-indices ${{ matrix.matchup }} \
            --config eldrazi-rf/experiment.json \
            --forge-jar "forge-${FORGE_VERSION}.jar" \
            --output eldrazi-rf-results-${{ matrix.matchup }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldrazi-rf-results-${{ matrix.matchup }}
          path: |
            eldrazi-rf-results-${{ matrix.matchup }}/
            eldrazi-rf/*.dck
            eldrazi-rf/experiment.json
          if-no-files-found: warn
          retention-days: 30
