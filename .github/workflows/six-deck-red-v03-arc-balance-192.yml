name: Six-Deck Red v0.3 Arc Lightning Balance 192

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/six-deck-red-v03-arc-balance-20260903

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"
  DECK_DIR: experiments/six-deck-v0.1/decks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify harness and candidate decks
        run: |
          python -m unittest discover -s tests -v
          grep -Fx 'Name=Mono Red Burn v0.3' "$DECK_DIR/03-mono-red-burn.dck"
          grep -Fx '2 Flame Slash' "$DECK_DIR/03-mono-red-burn.dck"
          grep -Fx '2 Arc Lightning' "$DECK_DIR/03-mono-red-burn.dck"
          grep -Fx '2 Incinerate' "$DECK_DIR/03-mono-red-burn.dck"
          ! grep -F 'Needle Drop' "$DECK_DIR/03-mono-red-burn.dck"
          grep -Fx 'Name=Mono White Tokens v0.4' "$DECK_DIR/01-mono-white-tokens.dck"
          grep -Fx 'Name=Mono Blue Tempo Control v0.2 AI-safe' "$DECK_DIR/05-mono-blue-tempo-control.dck"
          python - <<'PY'
          from pathlib import Path
          for deck in sorted(Path('experiments/six-deck-v0.1/decks').glob('*.dck')):
              total = sum(int(line.split(' ', 1)[0]) for line in deck.read_text().splitlines() if line[:1].isdigit())
              assert total == 60, f'{deck}: {total} cards'
          PY

  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
          sha256sum "forge-${FORGE_VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: red-v03-forge-runtime
          path: |
            forge-${{ env.FORGE_VERSION }}.jar
            res/
          retention-days: 1

  audit:
    needs: [validate, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: red-v03-forge-runtime
      - name: Audit Arc Lightning decisions in 24 games
        run: |
          mkdir -p audit "$HOME/.forge/decks/constructed"
          cp "$DECK_DIR"/*.dck "$HOME/.forge/decks/constructed/"
          timeout 900s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d 03-mono-red-burn.dck 04-mono-black-sacrifice.dck -D "$DECK_DIR" \
            -n 12 -c 120 -s 103401 > audit/red-first.log 2>&1
          timeout 900s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d 04-mono-black-sacrifice.dck 03-mono-red-burn.dck -D "$DECK_DIR" \
            -n 12 -c 120 -s 103402 > audit/red-second.log 2>&1
          test "$(grep -hF 'Game Result: Game' audit/*.log | wc -l)" = 24
          grep -hF 'cast Arc Lightning' audit/*.log >/dev/null
          ! grep -Eiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|No deck found|Could not load deck|match cannot start|Forge exited' audit/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-v03-arc-audit
          path: audit/
          if-no-files-found: error
          retention-days: 30

  balance:
    needs: [validate, forge, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: red-white
            opponent: 01-mono-white-tokens.dck
            seed: 103001
          - label: red-green
            opponent: 02-mono-green-ramp.dck
            seed: 103101
          - label: red-black
            opponent: 04-mono-black-sacrifice.dck
            seed: 103201
          - label: red-blue
            opponent: 05-mono-blue-tempo-control.dck
            seed: 103301
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: red-v03-forge-runtime
      - name: Run 48 orientation-balanced verbose games
        env:
          LABEL: ${{ matrix.label }}
          OPPONENT: ${{ matrix.opponent }}
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p "red-${LABEL}"
          mkdir -p "$HOME/.forge/decks/constructed"
          cp "$DECK_DIR"/*.dck "$HOME/.forge/decks/constructed/"
          timeout 1200s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d 03-mono-red-burn.dck "$OPPONENT" -D "$DECK_DIR" \
            -n 24 -c 120 -s "$SEED" > "red-${LABEL}/red-first.log" 2>&1
          reverse_seed=$((SEED + 1))
          timeout 1200s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d "$OPPONENT" 03-mono-red-burn.dck -D "$DECK_DIR" \
            -n 24 -c 120 -s "$reverse_seed" > "red-${LABEL}/red-second.log" 2>&1
          test "$(grep -hF 'Game Result: Game' red-${LABEL}/*.log | wc -l)" = 48
          grep -hF 'Simulation mode' red-${LABEL}/*.log >/dev/null
          ! grep -Eiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|No deck found|Could not load deck|match cannot start|Forge exited' red-${LABEL}/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-balance-${{ matrix.label }}
          path: red-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: balance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: red-balance-*
          path: red-balance-192
      - name: Verify completeness and card behavior
        run: |
          test "$(find red-balance-192 -name '*.log' | wc -l)" = 8
          test "$(grep -rhF 'Game Result: Game' red-balance-192 | wc -l)" = 192
          grep -rhF 'cast Flame Slash' red-balance-192 >/dev/null
          grep -rhF 'cast Arc Lightning' red-balance-192 >/dev/null
          ! grep -rF 'cast Needle Drop' red-balance-192
          ! grep -rEiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|No deck found|Could not load deck|match cannot start|Forge exited' red-balance-192
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-deck-red-v03-arc-targeted-balance-192
          path: red-balance-192/
          if-no-files-found: error
          retention-days: 30
