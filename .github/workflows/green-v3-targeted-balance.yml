name: Green v3 Targeted Balance 192

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/six-deck-budget-pilot-20260903
    paths:
      - experiments/five-mono-teaching-v2/decks/02-mono-green-ramp-teaching-v2.dck
      - experiments/five-mono-teaching-v2/decks/04-mono-black-sacrifice-teaching-v2.dck
      - .github/workflows/green-v3-targeted-balance.yml

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  V1_DIR: experiments/five-mono-teaching-v1/decks
  V2_DIR: experiments/five-mono-teaching-v2/decks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact inputs
        run: |
          set -euo pipefail
          green="$V2_DIR/02-mono-green-ramp-teaching-v2.dck"
          black="$V2_DIR/04-mono-black-sacrifice-teaching-v2.dck"
          for deck in "$green" "$black" "$V1_DIR/01-mono-white-tokens-teaching.dck" "$V1_DIR/03-mono-red-burn-teaching.dck" "$V1_DIR/05-mono-blue-tempo-control-teaching.dck"; do
            test "$(awk '/^[0-9]+ / {sum += $1} END {print sum}' "$deck")" = 60
          done
          grep -Fx '3 Pestilent Wolf' "$green"
          grep -Fx '3 Ram Through' "$green"
          grep -Fx '2 Savage Punch' "$green"
          grep -Fx '1 Beast Within' "$green"
          grep -Fx '1 Colossal Majesty' "$green"
          grep -Fx '22 Forest' "$green"
          grep -Fx "1 Rogue's Passage" "$green"
          grep -Fx '2 Falkenrath Noble' "$black"
          grep -Fx '1 Ifnir Deadlands' "$black"

  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Download stock Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
          sha256sum "forge-${FORGE_VERSION}.jar" > forge-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: green-v3-stock-forge-${{ env.FORGE_VERSION }}
          path: |
            forge-${{ env.FORGE_VERSION }}.jar
            forge-sha256.txt
            res/
          retention-days: 1

  simulate:
    needs: [validate, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {label: 01-green-vs-white, a: 02-mono-green-ramp-teaching-v2.dck, b: 01-mono-white-tokens-teaching.dck, seed: 96001}
          - {label: 02-white-vs-green, a: 01-mono-white-tokens-teaching.dck, b: 02-mono-green-ramp-teaching-v2.dck, seed: 96002}
          - {label: 03-green-vs-red, a: 02-mono-green-ramp-teaching-v2.dck, b: 03-mono-red-burn-teaching.dck, seed: 96003}
          - {label: 04-red-vs-green, a: 03-mono-red-burn-teaching.dck, b: 02-mono-green-ramp-teaching-v2.dck, seed: 96004}
          - {label: 05-green-vs-black, a: 02-mono-green-ramp-teaching-v2.dck, b: 04-mono-black-sacrifice-teaching-v2.dck, seed: 96005}
          - {label: 06-black-vs-green, a: 04-mono-black-sacrifice-teaching-v2.dck, b: 02-mono-green-ramp-teaching-v2.dck, seed: 96006}
          - {label: 07-green-vs-blue, a: 02-mono-green-ramp-teaching-v2.dck, b: 05-mono-blue-tempo-control-teaching.dck, seed: 96007}
          - {label: 08-blue-vs-green, a: 05-mono-blue-tempo-control-teaching.dck, b: 02-mono-green-ramp-teaching-v2.dck, seed: 96008}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v4
        with:
          name: green-v3-stock-forge-${{ env.FORGE_VERSION }}
      - name: Run 24 verbose games
        env:
          LABEL: ${{ matrix.label }}
          DECK_A: ${{ matrix.a }}
          DECK_B: ${{ matrix.b }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p combined-decks result "$HOME/.forge/decks/constructed"
          cp "$V1_DIR"/*.dck combined-decks/
          cp "$V2_DIR"/*.dck combined-decks/
          cp combined-decks/*.dck "$HOME/.forge/decks/constructed/"
          timeout 600s xvfb-run -a java -jar "forge-${FORGE_VERSION}.jar" sim \
            -d "$DECK_A" "$DECK_B" -D combined-decks -n 24 -c 120 -s "$SEED" \
            > "result/${LABEL}.log" 2>&1
          test "$(grep -Fc 'Game Result: Game' "result/${LABEL}.log")" = 24
          grep -F 'Simulation mode' "result/${LABEL}.log" >/dev/null
          ! grep -Eiq 'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|Forge exited' "result/${LABEL}.log"
          printf '{"label":"%s","deck_a":"%s","deck_b":"%s","seed":%s,"requested":24}\n' \
            "$LABEL" "$DECK_A" "$DECK_B" "$SEED" > "result/${LABEL}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-v3-${{ matrix.label }}
          path: result/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: green-v3-0*
          path: targeted-results
      - name: Aggregate and enforce integrity
        run: |
          python - <<'PY'
          import json, re
          from collections import defaultdict
          from pathlib import Path

          rows, failures = [], []
          for meta_path in sorted(Path('targeted-results').glob('green-v3-*/*.json')):
              meta = json.loads(meta_path.read_text())
              logs = list(meta_path.parent.glob('*.log'))
              if len(logs) != 1:
                  failures.append({'label': meta['label'], 'logs': len(logs)})
                  continue
              text = logs[0].read_text(errors='replace')
              results = re.findall(r'Game Result: Game .*? (Ai\([12]\)-.+?) has won!', text)
              errors = re.findall(r'NullPointerException|UnsupportedOperationException|Card not found|Unable to load deck|Forge exited', text, re.I)
              rows.append({**meta, 'wins_a': sum('Ai(1)-' in x for x in results),
                           'wins_b': sum('Ai(2)-' in x for x in results), 'parsed': len(results)})
              if len(results) != 24 or errors:
                  failures.append({'label': meta['label'], 'parsed': len(results), 'errors': errors})
          if len(rows) != 8 or failures:
              raise SystemExit(f'INTEGRITY FAILURE rows={len(rows)} failures={failures}')

          short = {
              '02-mono-green-ramp-teaching-v2.dck':'Green v3',
              '01-mono-white-tokens-teaching.dck':'White',
              '03-mono-red-burn-teaching.dck':'Red',
              '04-mono-black-sacrifice-teaching-v2.dck':'Black v2',
              '05-mono-blue-tempo-control-teaching.dck':'Blue',
          }
          combined = defaultdict(lambda: defaultdict(int))
          orientations = []
          for row in rows:
              a, b = short[row['deck_a']], short[row['deck_b']]
              key = tuple(sorted((a,b)))
              combined[key][a] += row['wins_a']; combined[key][b] += row['wins_b']
              orientations.append({'label':row['label'], a:row['wins_a'], b:row['wins_b'], 'games':24})
          output = []
          for opponent in ['White','Red','Black v2','Blue']:
              key = tuple(sorted(('Green v3', opponent)))
              gw, ow = combined[key]['Green v3'], combined[key][opponent]
              output.append({'opponent':opponent, 'green_wins':gw, 'green_rate':gw/48,
                             'opponent_wins':ow, 'opponent_rate':ow/48, 'games':48})
          Path('green-v3-summary.json').write_text(json.dumps({'games':192,'games_per_matchup':48,
              'results':output,'orientations':orientations},indent=2))
          print('INTEGRITY PASS: 8 orientation logs, 192/192 parsed games, zero flagged errors')
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: green-v3-targeted-192
          path: |
            targeted-results/
            green-v3-summary.json
          retention-days: 30
