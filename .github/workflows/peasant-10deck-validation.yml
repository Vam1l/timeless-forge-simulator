name: Peasant+ 10-Deck Forge AI Targeted Validation

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/ai-balancepeasant-10deck-roundrobin

permissions: read-all

env:
  PYTHONUNBUFFERED: "1"

jobs:
  aggregate:
    name: Aggregate & Report Validation Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Batch 1 results from run 33239919686
        uses: actions/download-artifact@v4
        with:
          name: batch-1-results
          run-id: 33239919686
          path: all-batch-results/batch-1-results

      - name: Download Batch 2 results from run 33239919686
        uses: actions/download-artifact@v4
        with:
          name: batch-2-results
          run-id: 33239919686
          path: all-batch-results/batch-2-results

      - name: Aggregate results
        run: |
          python scripts/aggregate_results.py all-batch-results validation-results

      - name: Build results report
        run: |
          python scripts/build_results_report.py validation-results

      - name: Check for anomalies
        run: |
          python scripts/check_anomalies.py validation-results || true

      - name: Upload aggregated validation results
        uses: actions/upload-artifact@v4
        with:
          name: peasant-10deck-validation-results
          path: validation-results/
