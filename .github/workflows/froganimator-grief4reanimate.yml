name: Froganimator Grief3 Reanimate4 AB

on:
  push:
    branches:
      - analysis/froganimator-grief4reanimate
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "2.0.14"
  JAVA_VERSION: "17"

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        batch: [0,1,2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download Forge
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/Card-Forge/forge/releases/download/forge-${FORGE_VERSION}/forge-installer-${FORGE_VERSION}.tar.bz2" \
            --output forge.tar.bz2
          tar -xjf forge.tar.bz2
          cp "forge-gui-desktop-${FORGE_VERSION}-jar-with-dependencies.jar" "forge-${FORGE_VERSION}.jar"
          test -s "forge-${FORGE_VERSION}.jar"
      - name: Run A/B screen
        run: |
          if [ "${{ matrix.batch }}" = "0" ]; then
            IDX="0 1 2 3 4 5 6 7"
          elif [ "${{ matrix.batch }}" = "1" ]; then
            IDX="8 9 10 11 12 13 14 15"
          else
            IDX="16 17"
          fi
          python scripts/run_matchup_batch.py \
            --matchup-indices $IDX \
            --config froganimator-ab/experiment.json \
            --forge-jar "forge-${FORGE_VERSION}.jar" \
            --output "froganimator-ab-${{ matrix.batch }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: froganimator-ab-${{ matrix.batch }}
          path: froganimator-ab-${{ matrix.batch }}/
          if-no-files-found: warn
          retention-days: 30
