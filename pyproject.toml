[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeless-forge-simulator"
version = "0.1.0"
description = "Reproducible Forge AI matchup orchestration for MTG Timeless"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Emmanuel Munoz"}]

[project.scripts]
timeless-forge = "timeless_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
